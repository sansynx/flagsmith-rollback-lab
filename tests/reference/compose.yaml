services:
  db:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: ${REFERENCE_DB_PASSWORD:?Use the reference verification runner}
      POSTGRES_DB: flagsmith
    healthcheck:
      test: [CMD-SHELL, "pg_isready -d flagsmith -U postgres"]
      interval: 2s
      retries: 20
  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.292.0
    environment:
      DATABASE_URL: postgresql://postgres:${REFERENCE_DB_PASSWORD}@db:5432/flagsmith
      DJANGO_SECRET_KEY: ${REFERENCE_DB_PASSWORD}
      FLAGSMITH_DOMAIN: localhost
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      USE_POSTGRES_FOR_ANALYTICS: "true"
      CACHE_ENVIRONMENT_DOCUMENT_SECONDS: "0"
      CACHE_ENVIRONMENT_SEGMENTS_SECONDS: "0"
      SEGMENT_RULES_CONDITIONS_EXPLICIT_ORDERING_ENABLED: "true"
    ports:
      - "127.0.0.1::8000"
    healthcheck:
      test: [CMD, flagsmith, healthcheck, tcp]
      start_period: 60s
      interval: 5s
      timeout: 4s
      retries: 12
    volumes:
      - ../../rollout_rehearsal:/verification/rollout_rehearsal:ro
    depends_on:
      db:
        condition: service_healthy
