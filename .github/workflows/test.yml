name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/skills -v

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: npm ci --prefix dashboard-ui
      - run: npm run typecheck --prefix dashboard-ui
      - run: npm run build --prefix dashboard-ui
      - run: git diff --exit-code --stat -- rollout_rehearsal/dashboard_assets/
      - run: python -m pip install .
      - run: npx --prefix dashboard-ui playwright install --with-deps chromium
      - run: npm run test:browser --prefix dashboard-ui

  reference-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python tests/reference/run.py

  live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: live-demo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: live-demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: make demo
      - run: npm install --global @flagsmith/cli@2.0.0
      - name: Rehearse a rollback with the official Flagsmith CLI
        run: node scripts/verify-skill.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise the two-screen release and all six replays
        run: |
          node server/index.mjs > .runtime/origin.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:4197/api/scenarios >/dev/null; then break; fi
            sleep 1
          done
          node tests/live-shop-browser.mjs
          node tests/shopper-browser.mjs
          node tests/browser.mjs
